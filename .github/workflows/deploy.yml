name: Deploy Astro site to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  BUILD_PATH: '.'

jobs:
  contact-worker-semgrep:
    name: Contact worker Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan contact worker
        run: bash ./scripts/contact_worker/semgrep.sh

  build:
    name: Build
    # Pin 24.04: mobile WebKit snapshot baselines are captured on Ubuntu 24.04.
    # ubuntu-latest (26.04) ships a different WebKit build and shifts panel height
    # by ~1px, which fails extreme-zoom visual diffs.
    runs-on: ubuntu-24.04
    # Keep well under GitHub's 6h default so a stuck install fails fast.
    timeout-minutes: 90
    needs: contact-worker-semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "lockfile=yarn.lock" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "lockfile=package-lock.json" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ env.BUILD_PATH }}/${{ steps.detect-package-manager.outputs.lockfile }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        working-directory: ${{ env.BUILD_PATH }}
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: ${{ env.BUILD_PATH }}
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node ./scripts/ci/ensure-playwright.mjs --print-lock-version)" >> "$GITHUB_OUTPUT"
        working-directory: ${{ env.BUILD_PATH }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Ensure Playwright matches lockfile and install browsers
        # Same entry as scripts/ci/local.sh (ensure-playwright.sh → .mjs).
        run: bash ./scripts/ci/ensure-playwright.sh
        timeout-minutes: 15
        working-directory: ${{ env.BUILD_PATH }}
      - name: Verify lint, format and test tooling
        run: |
          npx eslint --version
          npx prettier --version
          npx playwright --version
        working-directory: ${{ env.BUILD_PATH }}
      - name: Install contact worker dependencies
        run: npm ci
        working-directory: contact_worker
      - name: Lint, format and test
        run: bash ./scripts/all.sh
        working-directory: ${{ env.BUILD_PATH }}
        env:
          PW_WORKERS: '4'
          ALL_SH_CLEAN: '0'
          PW_SKIP_EXTREME_ZOOM_VISUAL: '0'
      - name: Lighthouse budget
        run: bash ./scripts/web/lighthouse.sh
        working-directory: ${{ env.BUILD_PATH }}
        env:
          LIGHTHOUSE_SKIP_BUILD: '1'
          LH_MAX_LCP_MS: '4000'
          LH_MIN_PERF_SCORE: '0.90'
          LH_PROFILE_MAX_LCP_MS: '6000'
          LH_PROFILE_MIN_PERF_SCORE: '0.76'
          LH_ATTEMPTS: '3'
      - name: Build with Astro
        run: bash ./scripts/web/build-pages.sh
        working-directory: ${{ env.BUILD_PATH }}
        env:
          ASTRO_SITE: ${{ steps.pages.outputs.origin }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
          PUBLIC_LAYOUT_DEBUG_TOKEN: ${{ secrets.PUBLIC_LAYOUT_DEBUG_TOKEN }}
      - name: Verify sitemap output
        run: bash ./scripts/web/verify-sitemap.sh
        working-directory: ${{ env.BUILD_PATH }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
