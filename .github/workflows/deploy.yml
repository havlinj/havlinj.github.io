name: Deploy Astro site to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  BUILD_PATH: '.'

jobs:
  contact-worker-semgrep:
    name: Contact worker Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan contact worker
        run: bash ./scripts/contact_worker/semgrep.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: contact-worker-semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "lockfile=yarn.lock" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "lockfile=package-lock.json" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ env.BUILD_PATH }}/${{ steps.detect-package-manager.outputs.lockfile }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        working-directory: ${{ env.BUILD_PATH }}
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: ${{ env.BUILD_PATH }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: ${{ env.BUILD_PATH }}
      - name: Verify lint, format and test tooling
        run: |
          npx eslint --version
          npx prettier --version
          npx playwright --version
        working-directory: ${{ env.BUILD_PATH }}
      - name: Install contact worker dependencies
        run: npm ci
        working-directory: contact_worker
      - name: Lint, format and test
        run: bash ./scripts/all.sh
        working-directory: ${{ env.BUILD_PATH }}
        env:
          PW_WORKERS: '4'
          ALL_SH_CLEAN: '0'
          PW_SKIP_EXTREME_ZOOM_VISUAL: '0'
      - name: Lighthouse budget
        run: bash ./scripts/web/lighthouse.sh
        working-directory: ${{ env.BUILD_PATH }}
        env:
          LIGHTHOUSE_SKIP_BUILD: '1'
          LH_MAX_LCP_MS: '4000'
          LH_MIN_PERF_SCORE: '0.84'
          LH_ATTEMPTS: '3'
      - name: Build with Astro
        run: bash ./scripts/web/build-pages.sh
        working-directory: ${{ env.BUILD_PATH }}
        env:
          ASTRO_SITE: ${{ steps.pages.outputs.origin }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
          PUBLIC_LAYOUT_DEBUG_TOKEN: ${{ secrets.PUBLIC_LAYOUT_DEBUG_TOKEN }}
      - name: Verify sitemap output
        run: bash ./scripts/web/verify-sitemap.sh
        working-directory: ${{ env.BUILD_PATH }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
